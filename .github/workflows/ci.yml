name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go vet, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The operator joins once its unchecked errors are handled.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: ./mcp/...

      - name: Test
        run: go test -race ./...

  ui:
    name: UI lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the node:22 image ui/Dockerfile builds on.
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Every component is built from the same commit. Pushes to main publish
  # `latest` and `sha-<commit>`; a tag such as 0.9.0 publishes that version
  # of every image.
  images:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - go
      - ui
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            context: .
            file: operator/Dockerfile
            platforms: linux/amd64
          - name: mcp
            context: .
            file: mcp/Dockerfile
            platforms: linux/amd64
          - name: ui
            context: ui
            file: ui/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/codemowers/driftmower/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
