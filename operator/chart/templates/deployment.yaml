apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-operator
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: driftmower-operator
spec:
  # Every replica keeps its own complete in-memory model.
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-operator
  template:
    metadata:
      labels:
        app: driftmower-operator
    spec:
      serviceAccountName: driftmower-operator
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driftmower-operator
          image: {{ .Values.image | default (printf "ghcr.io/codemowers/driftmower:%s" .Chart.AppVersion) | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Callers present projected tokens for <service>.<namespace>.
            - name: MCP_AUDIENCE
              value: {{ printf "driftmower-operator.%s" .Release.Namespace | quote }}
            - name: CRAWLER_URL
              value: {{ printf "http://driftmower-crawler.%s.svc.cluster.local:8080" .Release.Namespace | quote }}
            - name: CRAWLER_TOKEN_FILE
              value: /var/run/secrets/driftmower/crawler/token
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - containerPort: 8080
              name: mcp
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: crawler-token
              mountPath: /var/run/secrets/driftmower/crawler
              readOnly: true
      volumes:
        # Rotating token the crawler accepts from this ServiceAccount only.
        - name: crawler-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ printf "driftmower-crawler.%s" .Release.Namespace | quote }}
                  expirationSeconds: 3600
                  path: token
