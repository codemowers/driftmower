apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClassName | quote }}
value: {{ .Values.priorityValue }}
globalDefault: false
preemptionPolicy: Never
description: "Image scans queue above end-user workloads and below infrastructure, without preempting running Pods."
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: driftmower-scans
spec:
  hard:
    pods: {{ .Values.parallelism | quote }}
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - {{ .Values.priorityClassName | quote }}
