{{- if .Values.clusterMCPServer.enabled }}
# The audience is derived from the in-cluster URL: driftmower-operator.<namespace>.
apiVersion: codemowers.ai/v1alpha1
kind: ClusterMCPServer
metadata:
  name: {{ .Values.clusterMCPServer.name | quote }}
spec:
  url: {{ printf "http://driftmower-operator.%s.svc.cluster.local:8080/mcp" .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: driftmower-operator-mcp-use
rules:
  - apiGroups: [codemowers.ai]
    resources: [clustermcpservers]
    resourceNames: [{{ .Values.clusterMCPServer.name | quote }}]
    verbs: [use]
{{- end }}
