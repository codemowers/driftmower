# Defaults to ghcr.io/codemowers/driftmower-operator tagged with the chart's
# appVersion. Skaffold overrides this with its built artifact.
image: ""

logLevel: info

# Advertise the MCP endpoint to codemowers/agent workers as a
# ClusterMCPServer of this name. Workers attach it when their ServiceAccount
# holds the custom verb "use" on it; bind the driftmower-operator-mcp-use
# ClusterRole to grant that.
clusterMCPServer:
  enabled: true
  name: driftmower-operator

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# Fetches releases and security advisories for every SourceRepository. The
# only component with internet egress; it holds no Secret access. Its
# inspection page listens on the Pod's loopback address only:
#   kubectl -n <namespace> port-forward deploy/driftmower-crawler 8082:ui
#   open http://localhost:8082/
crawler:
  # Interval between crawls of one source.
  interval: 6h
  # Gitea or Forgejo hosts besides codeberg.org and gitea.com.
  giteaHosts: []
  # Optional Secret with a GitHub token under key token. Without one GitHub
  # allows 60 requests per hour and a full crawl takes hours.
  githubTokenSecret: driftmower-crawler-github
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeSelector: {}
