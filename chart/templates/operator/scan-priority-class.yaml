{{- if .Values.operator.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Values.operator.priorityClassName | default "vulnerability-scan" | quote }}
value: {{ .Values.operator.priorityValue }}
globalDefault: false
preemptionPolicy: Never
description: "Driftmower scheduled Trivy scans"
{{- end }}
