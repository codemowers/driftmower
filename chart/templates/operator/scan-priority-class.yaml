{{- if .Values.operator.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Values.operator.priorityClassName | default (printf "%s-%s-scan" .Release.Namespace .Release.Name) | quote }}
value: {{ .Values.operator.priorityValue }}
globalDefault: false
preemptionPolicy: Never
description: "Image scans queue above end-user workloads and below infrastructure, without preempting running Pods."
{{- end }}
