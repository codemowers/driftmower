{{- if .Values.operator.enabled }}
{{- if not (has .Values.operator.trivy.strategy (list "operatorNamespace" "workloadNamespace")) }}
{{- fail "operator.trivy.strategy must be operatorNamespace or workloadNamespace" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-scan
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-scanner
rules:
  - apiGroups: [codemowers.io]
    resources: [containerimages]
    verbs: [get, list, watch, patch]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
  {{- if eq .Values.operator.trivy.strategy "workloadNamespace" }}
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ['']
    resources: [events]
    verbs: [list]
  - apiGroups: ['']
    resources: [serviceaccounts]
    resourceNames: [{{ printf "%s-scan" .Release.Name | quote }}]
    verbs: [get]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [{{ printf "%s-scan" .Release.Name | quote }}]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
  {{- if compact .Values.imagePullSecrets }}
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames:
      {{- range compact .Values.imagePullSecrets }}
      - {{ printf "scan-pull-%s" (trunc 40 (sha256sum (printf "%s/%s/%s" $.Release.Namespace $.Release.Name .))) | quote }}
      {{- end }}
    verbs: [get, update]
  {{- end }}
  {{- end }}
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-scanner
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-scanner
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ['']
    resources: [events]
    verbs: [list]
  {{- if and (eq .Values.operator.trivy.strategy "workloadNamespace") (compact .Values.imagePullSecrets) }}
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: {{ compact .Values.imagePullSecrets | toJson }}
    verbs: [get]
  {{- end }}
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-scanner
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-operator
spec:
  serviceName: {{ .Release.Name }}-operator
  replicas: 1
  # SBOM artifacts are local and reproducible. Never route uploads to a
  # non-leader replica while the leader waits for a result on its own disk.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: {{ .Release.Name }}-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app: {{ .Release.Name }}-operator
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with compact .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: operator
          image: {{ .Values.operator.image | quote }}
          env:
            - name: SCANNER_READER_ACCOUNT
              value: {{ .Release.Name }}-mcp
            - name: SCANNER_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: SCANNER_URL
              value: {{ printf "http://%s-operator.%s.svc:8080" .Release.Name .Release.Namespace | quote }}
            - name: SCANNER_SERVICE_ACCOUNT
              value: {{ .Release.Name }}-scan
            - name: SCANNER_IMAGE
              value: {{ .Values.operator.image | quote }}
            - name: TRIVY_IMAGE
              value: {{ .Values.operator.trivyImage | quote }}
            - name: TRIVY_DB_IMAGE
              value: {{ .Values.operator.databaseImage | quote }}
            - name: IMAGE_PULL_SECRETS
              value: {{ join "," (compact .Values.imagePullSecrets) | quote }}
            - name: SCAN_PRIORITY_CLASS
              value: {{ .Values.operator.priorityClassName | default "vulnerability-scan" | quote }}
            - name: SBOM_CACHE_MIB
              value: {{ .Values.operator.sbomCacheMiB | quote }}
            - name: SCAN_CPU_REQUEST
              value: {{ .Values.operator.trivy.cpuRequest | quote }}
            - name: SCAN_STRATEGY
              value: {{ .Values.operator.trivy.strategy | quote }}
            - name: SCAN_PARALLELISM
              value: {{ .Values.operator.trivy.parallelism | quote }}
            - name: SCAN_MAX_FAILED_PODS
              value: {{ .Values.operator.trivy.maxFailedPods | quote }}
            - name: SCAN_DAC_READ_SEARCH
              value: {{ .Values.operator.trivy.dacReadSearch | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: sboms
              mountPath: /cache
  volumeClaimTemplates:
    - metadata:
        name: sboms
        labels:
          app.kubernetes.io/instance: {{ .Release.Name | quote }}
          skaffold.dev/keep: "true"
      spec:
        {{- with .Values.operator.sbomStorageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ printf "%dMi" (add .Values.operator.sbomCacheMiB 64) }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-operator
spec:
  selector:
    app: {{ .Release.Name }}-operator
  ports:
    - name: http
      port: 8080
{{- end }}
