{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app: {{ .Release.Name }}-ui
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with compact .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: app
          image: {{ .Values.ui.image | quote }}
          ports:
            - containerPort: 8080
              name: http
          env:
            {{- with include "driftmower.trustedCA.env" . }}{{ . | nindent 12 }}{{- end }}
            {{- with .Values.ui.kubeContext }}
            - name: KUBECTL_CONTEXT
              value: {{ . | quote }}
            {{- end }}
            - name: MCP_URL
              {{- if eq .Values.mcp.auth.mode "anonymous" }}
              value: {{ .Values.mcp.publicUrl | default "http://127.0.0.1:3000" | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: oidc-client-mcp-owner-secrets
                  key: OIDC_CLIENT_ORIGIN
              {{- end }}
          # With a 10m CPU request a starting Pod can take seconds to answer;
          # the startup probe covers that, so the others need not be lenient.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          {{- if .Values.trustedCA.configMapName }}
          volumeMounts:
            {{- with include "driftmower.trustedCA.volumeMount" . }}{{ . | nindent 12 }}{{- end }}
      volumes:
        {{- with include "driftmower.trustedCA.volume" . }}{{ . | nindent 8 }}{{- end }}
          {{- end }}
{{- end }}
