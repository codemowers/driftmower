{{- if and .Values.mcp.enabled (or .Values.operator.enabled .Values.mcp.userAccess.enabled) (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-security
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    monitoring.codemowers.io/instance: {{ .Release.Name | quote }}
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mcp
  endpoints:
    - port: drift
      path: /security-metrics
      honorLabels: true
      interval: 5m
      scrapeTimeout: 30s
      relabelings:
        - targetLabel: driftmower_namespace
          replacement: {{ .Release.Namespace | quote }}
        - targetLabel: driftmower_instance
          replacement: {{ .Release.Name | quote }}
{{- end }}
