{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app: {{ .Release.Name }}-mcp
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-mcp
  ports:
    - port: 3000
      targetPort: 3000
      name: mcp
    - port: 3001
      targetPort: health
      name: health
    - port: 3002
      targetPort: drift
      name: drift
---
# Drift metrics list every namespace's workloads without a caller to scope
# them, so only explicitly selected Prometheus instances may scrape them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: {{ .Release.Name }}-mcp
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-mcp
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: mcp
        - port: health
    - from:
        - podSelector:
            matchLabels:
              prometheus: {{ .Release.Name }}
      ports:
        - port: drift
    {{- with .Values.mcp.metrics.prometheusNamespace }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: drift
    {{- end }}
{{- end }}
