{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled }}
# Bearer tokens are verified in-process; an edge login redirect would break
# headless MCP clients. The health port stays cluster-internal.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: mcp
spec:
  rules:
    - host: {{ .Values.mcp.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  name: mcp
{{- end }}
