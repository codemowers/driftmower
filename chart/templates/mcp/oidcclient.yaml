{{- if and .Values.mcp.enabled (ne .Values.mcp.auth.mode "anonymous") }}
# Public native client: MCP clients run locally, use PKCE and request the
# /mcp audience with the RFC 8707 resource parameter. Passmower has no dynamic
# client registration. Loopback ports are ignored, but hostnames and paths must
# match exactly.
apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  name: mcp
  annotations:
    kubernetes.io/description: >-
      Discover this cluster's identity, capabilities, admission policies, schemas,
      access, workloads, image findings, logs and metrics. Check current facts and
      exact operation access before requested cluster changes. Calls use the
      authenticated caller's Kubernetes permissions.
spec:
  applicationType: native
  {{- with .Values.mcp.dashboard.localOrigins }}
  allowedCORSOrigins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  displayName: Driftmower MCP
  uri: https://mcp/
  redirectUris:
    - http://localhost:33418/callback
    - http://127.0.0.1:33418/callback
    - http://[::1]:33418/callback
    - http://localhost:19876/mcp/oauth/callback
    - http://127.0.0.1:19876/mcp/oauth/callback
    - http://[::1]:19876/mcp/oauth/callback
  grantTypes:
    - authorization_code
    - refresh_token
  responseTypes:
    - code
  # namespaces carries the tenancy claim; offline_access enables refresh.
  availableScopes:
    - openid
    - profile
    - email
    - groups
    - namespaces
    - offline_access
  tokenEndpointAuthMethod: none
  pkce: true
{{- end }}
