apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftmower-operator
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: driftmower-operator
rules:
  # Workload inventory. Secrets, ConfigMaps and PVCs are watched as
  # PartialObjectMetadata, but RBAC cannot express metadata-only reads: list
  # on secrets grants their contents to this ServiceAccount.
  - apiGroups: [""]
    resources: [pods, replicationcontrollers, persistentvolumeclaims, configmaps, secrets, services]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [list, watch]
  # Optional adapters, watched when their APIs are served.
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [list, watch]
  # Caller authentication and per-request authorization.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: driftmower-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: driftmower-operator
subjects:
  - kind: ServiceAccount
    name: driftmower-operator
    namespace: {{ .Release.Namespace | quote }}
