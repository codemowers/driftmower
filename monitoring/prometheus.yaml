# Dedicated drift history. No general cluster-monitoring targets are selected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftmower-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: driftmower-prometheus
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: driftmower-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: driftmower-prometheus
subjects:
  - kind: ServiceAccount
    name: driftmower-prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: driftmower
spec:
  replicas: 1
  serviceAccountName: driftmower-prometheus
  scrapeInterval: 5m
  scrapeTimeout: 30s
  evaluationInterval: 5m
  retention: 90d
  retentionSize: 8GB
  serviceMonitorSelector:
    matchLabels:
      monitoring.codemowers.io/instance: driftmower
  podMonitorSelector:
    matchLabels:
      monitoring.codemowers.io/instance: driftmower
  ruleSelector:
    matchLabels:
      monitoring.codemowers.io/instance: driftmower
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: prometheus
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: driftmower-prometheus
spec:
  selector:
    prometheus: driftmower
  ports:
    - name: web
      port: 9090
      targetPort: web
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: driftmower-history
  labels:
    monitoring.codemowers.io/instance: driftmower
spec:
  selector:
    matchLabels:
      app: driftmower-mcp
  endpoints:
    - port: health
      path: /drift-metrics
      interval: 5m
      scrapeTimeout: 30s
      scheme: http
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: driftmower_(version_.*|image_created_timestamp_seconds)
          action: keep
