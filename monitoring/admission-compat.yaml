# Preserve admission-owned provenance when Prometheus Operator copies the
# Prometheus CR's annotations onto its generated StatefulSet during updates.
# This does not relax the cluster's provenance validation.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: driftmower-prometheus-provenance
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [statefulsets]
  matchConditions:
    - name: this-instance
      expression: request.namespace == 'driftmower' && object.metadata.name == 'prometheus-driftmower'
    - name: its-controller
      expression: request.userInfo.username == 'system:serviceaccount:prometheus-operator:prometheus-operator-kube-p-operator'
    - name: existing-provenance
      expression: oldObject.?metadata.?annotations[?'codemowers.io/created-by'].hasValue()
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{metadata: Object.metadata{annotations: {
            'codemowers.io/created-by': oldObject.metadata.annotations['codemowers.io/created-by']
          }}}
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          oldObject.?spec.?template.?metadata.?annotations[?'codemowers.io/workload-created-by'].hasValue()
          ? Object{spec: Object.spec{template: Object.spec.template{metadata: Object.spec.template.metadata{annotations: {
            'codemowers.io/workload-created-by': oldObject.spec.template.metadata.annotations['codemowers.io/workload-created-by']
          }}}}} : Object{}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: driftmower-prometheus-provenance
spec:
  policyName: driftmower-prometheus-provenance
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: driftmower
