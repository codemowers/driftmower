apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: driftmower-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: dashboard.driftmower.ee-lte-1.codemowers.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: driftmower-ui
                port:
                  number: 80
