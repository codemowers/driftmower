# Registers driftmower-ui as a confidential OIDC client with passmower.
# passmower's operator watches this CRD and generates the Secret
# `oidc-client-driftmower-ui-owner-secrets` in this namespace, containing
# OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / OIDC_IDP_URI / OIDC_IDP_WELL_KNOWN_URI.
# Both driftmower-ui (OIDC client) and driftmower-be (resource server, reads
# OIDC_IDP_URI as its issuer) consume that secret.
apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: driftmower-ui
  namespace: driftmowers
spec:
  applicationType: web
  displayName: Driftmower
  uri: https://driftmower.ee/
  redirectUris:
    - https://driftmower.ee/api/auth/callback
  grantTypes:
    - authorization_code
    - refresh_token
  responseTypes:
    - code
  # Request the full group list (not allowed_groups) so driftmower can do its
  # own per-project authorization against passmower group membership.
  # email claims are delivered under the `profile` scope in passmower; `email`
  # is not a separately-requestable scope.
  # passmower 2.x emits the email claim only when `email` is requested.
  # `applications` backs the OIDC Applications page, `namespaces` carries the
  # tenancy claim. Both need passmower chart >= 2.1.1; the 2.1.0 CRD rejects
  # them. The Deployment's OIDC_SCOPE must stay a subset of this list.
  availableScopes:
    - openid
    - profile
    - email
    - groups
    # Grants access to passmower's per-user /api/apps launcher list, which
    # backs the OIDC Applications page.
    - applications
    # Carries the codemowers.io/namespaces claim (accessible-namespace set)
    # into tokens; consumed by driftmower-be tenancy scoping.
    - namespaces
    - offline_access
  tokenEndpointAuthMethod: client_secret_basic
  pkce: true
