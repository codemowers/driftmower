# Public browser client. The static dashboard holds no client secret.
apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: driftmower-ui
spec:
  applicationType: web
  displayName: Driftmower
  uri: https://dashboard.driftmower.ee-lte-1.codemowers.io/
  redirectUris:
    - https://dashboard.driftmower.ee-lte-1.codemowers.io/callback
  allowedCORSOrigins:
    - https://dashboard.driftmower.ee-lte-1.codemowers.io
  grantTypes:
    - authorization_code
    - refresh_token
  responseTypes:
    - code
  availableScopes:
    - openid
    - profile
    - email
    - groups
    - namespaces
    - offline_access
  tokenEndpointAuthMethod: none
  pkce: true
