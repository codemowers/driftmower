apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-ui
  namespace: driftmowers
spec:
  selector:
    matchLabels:
      app: driftmower-ui
  template:
    metadata:
      labels:
        app: driftmower-ui
    spec:
      serviceAccountName: driftmower-ui
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: rasmus-gitea-registry-secret
      containers:
        - name: app
          image: zot.ee-lte-1.codemowers.io/ua69abad191/driftmower-ui:0.1.0
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://driftmower-be:3030"
            - name: ARGO_URL
              value: "https://argocd.ee-west-1.codemowers.io/"
