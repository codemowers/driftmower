apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-ui
  template:
    metadata:
      labels:
        app: driftmower-ui
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: app
          image: driftmower-ui
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MCP_URL
              value: https://mcp.driftmower.ee-lte-1.codemowers.io/mcp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
