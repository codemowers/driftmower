apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-ui
  namespace: driftmowers
spec:
  # The netstatd fan-in hub is per-process; a second replica would double the upstream sockets.
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-ui
  template:
    metadata:
      labels:
        app: driftmower-ui
    spec:
      serviceAccountName: driftmower-ui
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: driftmower-ui-registry
      containers:
        - name: app
          image: zot.registry.ee-lte-1.codemowers.io/originaldreamer/driftmower-ui
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://driftmower-be:3030"
            - name: ARGO_URL
              value: "https://argocd.ee-west-1.codemowers.io"
            - name: LLM_BASE_URL
              value: "https://llama-api.ee-lte-1.codemowers.io/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-api-token
                  key: token
                  optional: true
            # Optional: raises the GitHub Releases rate limit for the Actions card's changelog lookups.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
            # Tenancy control plane behind the Sandboxes page; unset disables it.
            - name: PLATFORM_MANAGER_URL
              value: "http://platform-manager.platform-manager.svc"
            # Resource indicator requested for platform-manager tokens; must
            # equal platform-manager's OIDC audience.
            - name: PLATFORM_MANAGER_AUDIENCE
              value: "https://platform-manager-api"
            # Public base URL of this app (used to build the OIDC redirect URI).
            - name: APP_BASE_URL
              value: "https://driftmower.ee"
            # Resource indicator requested from passmower; must equal the
            # backend's OIDC_AUDIENCE so the JWT access token validates.
            - name: OIDC_AUDIENCE
              value: "https://driftmower-api"
            # --- driftmower-mcp, the platform's MCP gateway ---
            # driftmower-mcp owns the provisioning capability layer. The
            # Provisioning page reads it through this app's
            # /api/provisioning/capabilities, which mints an MCP-audience token
            # from the user's session and forwards the query here. Same-namespace
            # Service name; qualify it when the two run in different namespaces.
            - name: DRIFTMOWER_MCP_URL
              value: "http://driftmower-mcp:3000"
            # Resource indicator requested for those tokens. Must equal the
            # audience driftmower-mcp verifies (its MCP_AUDIENCE).
            - name: MCP_AUDIENCE
              value: "https://driftmower-mcp"
            # Appends the MCP resource indicator at login, which both the
            # Provisioning page and /api/mcp/token need: while it is off the page
            # explains that MCP is disabled instead of showing cluster facts.
            # OFF by default on purpose: if passmower rejects a third `resource`,
            # *login breaks for every user*, not just MCP. Turn on only after
            # verifying on a deployed build; rollback is unsetting it.
            - name: MCP_ENABLED
              value: "false"
            # Printed in the /api/mcp/token quick-start command and in the
            # provisioning page's connection recipes.
            - name: MCP_PUBLIC_URL
              value: "https://driftmower-mcp.ee-lte-1.codemowers.io"
            # Client id of the public `driftmower-mcp` OIDCClient
            # (driftmower-mcp/manifests/oidcclient.yaml), shown on the
            # provisioning page so a client can run the OAuth flow itself.
            # passmower has no dynamic client registration, so a client cannot
            # discover this — it has to be displayed.
            #
            # A public client's id is not a secret; it travels in every
            # authorize URL, and the client holds no usable secret. Optional so
            # this app still starts before the MCP client is deployed — the
            # page then omits the OAuth flow rather than offering a dead end.
            - name: MCP_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-mcp-owner-secrets
                  key: OIDC_CLIENT_ID
                  optional: true
            # Must be a subset of the OIDCClient's availableScopes (k8s/oidcclient.yaml).
            - name: OIDC_SCOPE
              value: "openid profile email groups applications namespaces offline_access"
            # Generated by passmower from the OIDCClient CRD (k8s/oidcclient.yaml).
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_IDP_URI
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_IDP_URI
            # Random >=32-char key used to encrypt the BFF session cookie.
            # Create with:
            #   kubectl -n driftmowers create secret generic driftmower-ui-session \
            #     --from-literal=SESSION_SECRET=$(openssl rand -hex 32)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: driftmower-ui-session
                  key: SESSION_SECRET
