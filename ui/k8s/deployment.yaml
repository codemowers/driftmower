apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-ui
  namespace: driftmowers
spec:
  # The netstatd fan-in hub is per-process; a second replica would double the upstream sockets.
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-ui
  template:
    metadata:
      labels:
        app: driftmower-ui
    spec:
      serviceAccountName: driftmower-ui
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: rasmus-gitea-registry-secret
      containers:
        - name: app
          image: zot.ee-lte-1.codemowers.io/originaldreamer/driftmower-ui:0.1.0
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: "http://driftmower-be:3030"
            - name: ARGO_URL
              value: "https://argocd.ee-west-1.codemowers.io/"
            - name: LLM_BASE_URL
              value: "https://llama-api.ee-lte-1.codemowers.io/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llama-api-token
                  key: token
            # Optional: raises the GitHub Releases rate limit for the Actions card's changelog lookups.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
            # Tenancy control plane behind the Sandboxes page; unset disables it.
            - name: PLATFORM_MANAGER_URL
              value: "http://platform-manager.platform-manager.svc"
            # Resource indicator requested for platform-manager tokens; must
            # equal platform-manager's OIDC audience.
            - name: PLATFORM_MANAGER_AUDIENCE
              value: "https://platform-manager-api"
            # Public base URL of this app (used to build the OIDC redirect URI).
            - name: APP_BASE_URL
              value: "https://driftmower-ui.ee-lte-1.codemowers.io"
            # Resource indicator requested from passmower; must equal the
            # backend's OIDC_AUDIENCE so the JWT access token validates.
            - name: OIDC_AUDIENCE
              value: "https://driftmower-api"
            # Must be a subset of the OIDCClient's availableScopes (k8s/oidcclient.yaml).
            - name: OIDC_SCOPE
              value: "openid profile email groups applications namespaces offline_access"
            # Generated by passmower from the OIDCClient CRD (k8s/oidcclient.yaml).
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_IDP_URI
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_IDP_URI
            # Random >=32-char key used to encrypt the BFF session cookie.
            # Create with:
            #   kubectl -n driftmowers create secret generic driftmower-ui-session \
            #     --from-literal=SESSION_SECRET=$(openssl rand -hex 32)
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: driftmower-ui-session
                  key: SESSION_SECRET
