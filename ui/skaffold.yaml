apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: driftmower-ui

deploy:
  kubectl: {}

build:
  artifacts:
    - image: driftmower-ui
      platforms:
        - linux/amd64
      docker:
        dockerfile: Dockerfile

manifests:
  rawYaml:
    - k8s/oidcclient.yaml
    - k8s/rbac.yaml
    - k8s/deployment.yaml
    - k8s/service.yaml
    - k8s/ingress.yaml
    - k8s/certificate.yaml
