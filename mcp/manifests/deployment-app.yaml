apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-mcp
  namespace: driftmowers
  labels:
    app: driftmower-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-mcp
  template:
    metadata:
      labels:
        app: driftmower-mcp
    spec:
      # No pod affinity and no volume: the analysis is read from driftmower-be
      # over the cluster network, so this pod can run anywhere.
      imagePullSecrets:
        - name: sergii-gitea-registry-secret
      containers:
        - name: driftmower-mcp
          image: git.codemowers.io/uq69adc8851/driftmower-mcp:latest
          ports:
            - containerPort: 3000
              name: mcp
            - containerPort: 3001
              name: health
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NODE_CONFIG_ENV
              value: 'default'
            - name: DRIFTMOWER_MCP_TRANSPORT
              value: 'http'
            - name: DRIFTMOWER_BE_URL
              value: 'http://driftmower-be:3030'
            # A token driftmower-be lists in auth.serviceTokens. It
            # authenticates as a service principal, which the backend exempts
            # from its own tenancy scoping; this server scopes what it returns.
            - name: DRIFTMOWER_BE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: driftmower-mcp-be-auth-token
                  key: token
            - name: DRIFTMOWER_MCP_HOST
              value: '::'
            - name: DRIFTMOWER_MCP_PORT
              value: '3000'
            - name: DRIFTMOWER_MCP_HEALTH_PORT
              value: '3001'
            - name: DRIFTMOWER_MCP_DEFAULT_LIMIT
              value: '20'
            - name: DRIFTMOWER_MCP_MAX_LIMIT
              value: '100'
            # Public URL of this server. Used to build the RFC 9728 resource
            # identifier and the resource_metadata pointer on every 401, which
            # is how an OAuth-capable MCP client discovers the flow.
            - name: MCP_PUBLIC_URL
              value: 'https://driftmower-mcp.ee-lte-1.codemowers.io'
            # MCP_AUDIENCE is deliberately unset. The server then verifies
            # `aud` against the `resource` it advertises -- MCP_PUBLIC_URL +
            # /mcp -- which is the only indicator a conformant client can end
            # up asking for. Set it only to follow something upstream that
            # mints for a different one, and never to driftmower-be's
            # OIDC_AUDIENCE: a token for the API is not a token for this
            # server.
            # passmower's public URL, matched against the token `iss` claim.
            # JWKS is fetched from ${OIDC_ISSUER}/jwks unless OIDC_JWKS_URI is
            # set. Same secret and key driftmower-be reads.
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-ui-owner-secrets
                  key: OIDC_IDP_URI
            # Cluster-internal base URL of driftmower-ui, which owns the
            # provisioning capability layer and the RBAC behind it. Unset means
            # the provisioning tools are not registered at all.
            - name: DRIFTMOWER_UI_URL
              value: 'http://driftmower-ui'
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          # Readiness and startup make a live call to driftmower-be, which the
          # server bounds at 3s; the probe has to outlast that.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /startupz
              port: health
            timeoutSeconds: 5
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              memory: '128Mi'
              cpu: '50m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
