# Publishes the MCP endpoint. Everything behind it verifies a passmower bearer
# token in-process (src/auth/), because an MCP client is not a browser: a
# cookie/redirect gate at the edge would be uncompletable by Claude Code,
# Cursor or any other headless client, and would strip the caller identity the
# tools need for tenancy scoping.
#
# Port 3000 only. The health port (3001) stays cluster-internal: its readiness
# probe reports database and schema state, which is nobody's business outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: driftmower-mcp
  namespace: driftmowers
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: driftmower-mcp-tls
  rules:
    - host: driftmower-mcp.ee-lte-1.codemowers.io
      http:
        paths:
          # One rule covers both /mcp and the RFC 9728 metadata documents under
          # /.well-known/oauth-protected-resource, which the server routes itself.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: driftmower-mcp
                port:
                  name: mcp
