apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftmower-mcp
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: driftmower-mcp-observability
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list]
  # Discover the infra-owned API ingress without creating objects in its namespace.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames: [kubelogin]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [list]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [list]
  # Cluster-wide capability catalogs: storage settings and admission policies.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, mutatingadmissionpolicies, validatingadmissionpolicybindings, mutatingadmissionpolicybindings]
    verbs: [list]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # The application checks the caller's get pods/log access before every read.
  # No impersonation, secrets, pod exec, or write permissions are granted.
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: driftmower-mcp-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: driftmower-mcp-observability
subjects:
  - kind: ServiceAccount
    name: driftmower-mcp
    namespace: {{ .Release.Namespace | quote }}
