apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftmower-mcp
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: driftmower-mcp-observability
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, list, watch]
  # Caches are invalidated on change by watching RBAC objects and CRDs. Without
  # `watch` the server falls back to the review-cache TTL and logs a warning.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [list, watch]
  # Optional: lets a ServiceAccount token (e.g. Argo CD's) call the cache
  # invalidation webhook, gated by MCP_INVALIDATE_ALLOWED_SUBJECTS.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  # Provisioning facts (all read-only): per-namespace budget and network
  # posture, node topology, operator Deployments, and the parameter ConfigMap an
  # admission guard names. The guard chooses its ConfigMap's name, so a chart
  # cannot know it in advance; set rbac.paramConfigMapNames to narrow the grant.
  - apiGroups: ['']
    resources: [nodes, resourcequotas, limitranges]
    verbs: [list]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get]
{{- with .Values.rbac.paramConfigMapNames }}
    resourceNames:
{{ toYaml . | indent 6 }}
{{- end }}
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [list]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies]
    verbs: [list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  # Discover the infra-owned API ingress without creating objects in its namespace.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames: [kubelogin]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [list]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [list]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [list]
  # Cluster-wide capability catalogs: storage settings and admission policies.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, mutatingadmissionpolicies, validatingadmissionpolicybindings, mutatingadmissionpolicybindings]
    verbs: [list]
  # Every permission answer this server gives is a SubjectAccessReview asked as
  # the verified caller. This is a permission-probing capability: the server
  # only ever asks about the identity it just verified from the token.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # The application checks the caller's get pods/log access before every read.
  # No impersonation, secrets, pod exec, or write permissions are granted.
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: driftmower-mcp-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: driftmower-mcp-observability
subjects:
  - kind: ServiceAccount
    name: driftmower-mcp
    namespace: {{ .Release.Namespace | quote }}
