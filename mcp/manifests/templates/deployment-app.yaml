apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-mcp
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: driftmower-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-mcp
  template:
    metadata:
      labels:
        app: driftmower-mcp
    spec:
      serviceAccountName: driftmower-mcp
      terminationGracePeriodSeconds: 30
      # No pod affinity and no volume: the analysis is read from driftmower-be
      # over the cluster network, so this pod can run anywhere.
      imagePullSecrets:
        - name: sergii-gitea-registry-secret
      containers:
        - name: driftmower-mcp
          image: {{ .Values.image | quote }}
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
              name: mcp
            - containerPort: 3001
              name: health
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NODE_CONFIG_ENV
              value: 'default'
            {{- with .Values.cluster.id }}
            - name: DRIFTMOWER_CLUSTER_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.cluster.apiUrl }}
            - name: KUBERNETES_PUBLIC_API_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MCP_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-mcp-owner-secrets
                  key: OIDC_CLIENT_ID
            - name: DRIFTMOWER_MCP_TRANSPORT
              value: 'http'
            - name: DRIFTMOWER_BE_URL
              value: 'http://driftmower-be:3030'
            - name: PROMETHEUS_URL
              value: 'http://prometheus-operated.monitoring.svc.cluster.local:9090'
            - name: LOKI_URL
              value: 'http://loki.monitoring.svc.cluster.local:3100'
            # A token driftmower-be lists in auth.serviceTokens. It
            # authenticates as a service principal, which the backend exempts
            # from its own tenancy scoping; this server scopes what it returns.
            - name: DRIFTMOWER_BE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: driftmower-mcp-be-auth-token
                  key: token
            # Requires Passmower 2.7.0 or later to export OIDC_CLIENT_ORIGIN.
            # Public URL of this server. Used to build the RFC 9728 resource
            # identifier and the resource_metadata pointer on every 401, which
            # is how an OAuth-capable MCP client discovers the flow.
            - name: MCP_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-mcp-owner-secrets
                  key: OIDC_CLIENT_ORIGIN
            # MCP_AUDIENCE is deliberately unset. The server then verifies
            # `aud` against the `resource` it advertises -- MCP_PUBLIC_URL +
            # /mcp -- which is the only indicator a conformant client can end
            # up asking for. Set it only to follow something upstream that
            # mints for a different one, and never to driftmower-be's
            # OIDC_AUDIENCE: a token for the API is not a token for this
            # server.
            # passmower's public URL, matched against the token `iss` claim.
            # JWKS is fetched from ${OIDC_ISSUER}/jwks unless OIDC_JWKS_URI is
            # set. Read the issuer from this application's owner Secret.
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: oidc-client-driftmower-mcp-owner-secrets
                  key: OIDC_IDP_URI
            # Cluster-internal base URL of driftmower-ui, which owns the
            # remaining offering/readiness tools. Cluster capabilities read Kubernetes directly.
            - name: DRIFTMOWER_UI_URL
              value: 'http://driftmower-ui'
            # Public URL of driftmower-ui. A person who opens this server's own
            # hostname in a browser gets bounced there instead of a JSON 404.
            - name: DRIFTMOWER_UI_PUBLIC_URL
              value: 'https://driftmower-ui.codemowers.io'
          # Probes report local MCP readiness without contacting dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          startupProbe:
            httpGet:
              path: /startupz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              memory: '128Mi'
              cpu: '50m'
            limits:
              memory: '512Mi'
              cpu: '500m'
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
