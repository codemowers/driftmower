apiVersion: skaffold/v3
kind: Config
metadata:
  name: driftmower-mcp

build:
  local:
    useBuildkit: true
  artifacts:
    - image: driftmower-mcp
      platforms:
        - linux/amd64
      docker:
        dockerfile: Dockerfile
      # Runtime executes dist/: rebuild TypeScript changes instead of syncing unused source.

deploy:
  # Namespace comes from --namespace or the selected kubeconfig context.
  kubectl: {}

manifests:
  helm:
    releases:
      - name: driftmower-mcp
        chartPath: manifests
        skipBuildDependencies: true
        setValueTemplates:
          image: "{{.IMAGE_FULLY_QUALIFIED_driftmower_mcp}}"

portForward:
  - resourceType: deployment
    resourceName: driftmower-mcp
    port: 3000
    localPort: 3000
  - resourceType: deployment
    resourceName: driftmower-mcp
    port: 3001
    localPort: 3001
