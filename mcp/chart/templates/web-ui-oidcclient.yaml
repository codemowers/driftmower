{{- if .Values.webUi.enabled }}
apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: mcp-web
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    kubernetes.io/description: 'Browser explorer for this cluster’s MCP discovery and resource usage tools, using OpenID sign-in with PKCE.'
spec:
  applicationType: web
  displayName: Driftmower MCP Explorer
  uri: {{ printf "%s/ui" (trimSuffix "/" .Values.webUi.origin) | quote }}
  redirectUris:
    - {{ .Values.webUi.redirectUri | quote }}
  allowedCORSOrigins:
    - {{ trimSuffix "/" .Values.webUi.origin | quote }}
  grantTypes:
    - authorization_code
  responseTypes:
    - code
  availableScopes:
    - openid
    - profile
    - email
    - groups
    - namespaces
  tokenEndpointAuthMethod: none
  pkce: true
{{- end }}
