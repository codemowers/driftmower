{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: driftmower-mcp
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector:
    matchLabels:
      app: driftmower-mcp
  podMetricsEndpoints:
    - port: health
{{- end }}
