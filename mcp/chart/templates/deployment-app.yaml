apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-mcp
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: driftmower-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftmower-mcp
  template:
    metadata:
      labels:
        app: driftmower-mcp
    spec:
      serviceAccountName: driftmower-mcp
      terminationGracePeriodSeconds: 30
      containers:
        - name: driftmower-mcp
          image: {{ .Values.image | quote }}
          securityContext:
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3000
              name: mcp
            - containerPort: 3001
              name: health
          env:
            - name: NODE_ENV
              value: 'production'
            - name: MCP_WORKLOAD_RESTART_ENABLED
              value: {{ .Values.workloadRestart.enabled | quote }}
            - name: MCP_SERVICE_ACCOUNT_AUTH_ENABLED
              value: {{ .Values.serviceAccountAuth.enabled | quote }}
            {{- if .Values.dashboard.clientSecretName }}
            - name: MCP_BROWSER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dashboard.clientSecretName | quote }}
                  key: OIDC_CLIENT_ID
                  optional: true
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," (concat (list .Values.dashboard.origin) .Values.dashboard.localOrigins) | quote }}
            {{- end }}
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MCP_WEB_UI_ENABLED
              value: {{ .Values.webUi.enabled | quote }}
            {{- if .Values.webUi.enabled }}
            - name: MCP_WEB_UI_CLIENT_ID
              value: ""
              valueFrom:
                secretKeyRef:
                  name: oidc-client-mcp-web-owner-secrets
                  key: OIDC_CLIENT_ID
            {{- end }}
            {{- with .Values.cluster.id }}
            - name: DRIFTMOWER_CLUSTER_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.cluster.apiUrl }}
            - name: KUBERNETES_PUBLIC_API_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MCP_OAUTH_CLIENT_ID
              value: ""
              valueFrom:
                secretKeyRef:
                  name: oidc-client-mcp-owner-secrets
                  key: OIDC_CLIENT_ID
            - name: DRIFTMOWER_MCP_TRANSPORT
              value: 'http'
            - name: DRIFT_PROMETHEUS_URL
              value: {{ .Values.driftHistory.url | quote }}
            {{- if .Values.crawler.url }}
            # driftmower-crawler's reports back get_source_findings and
            # get_workload_findings; the token below authenticates the reads.
            - name: CRAWLER_URL
              value: {{ .Values.crawler.url | quote }}
            {{- end }}
            - name: PROMETHEUS_URL
              value: 'http://prometheus-operated.monitoring.svc.cluster.local:9090'
            - name: LOKI_URL
              value: 'http://loki.monitoring.svc.cluster.local:3100'
            # Requires Passmower 2.7.0 or later to export OIDC_CLIENT_ORIGIN.
            # Public URL of this server. Used to build the RFC 9728 resource
            # identifier and the resource_metadata pointer on every 401, which
            # is how an OAuth-capable MCP client discovers the flow.
            - name: MCP_PUBLIC_URL
              value: ""
              valueFrom:
                secretKeyRef:
                  name: oidc-client-mcp-owner-secrets
                  key: OIDC_CLIENT_ORIGIN
            # Clear a legacy literal audience during adoption of existing Deployments.
            # The server derives its audience from OIDC_CLIENT_ORIGIN plus /mcp.
            - name: MCP_AUDIENCE
              value: ""
            # passmower's public URL, matched against the token `iss` claim.
            # JWKS is fetched from ${OIDC_ISSUER}/jwks unless OIDC_JWKS_URI is
            # set. Read the issuer from this application's owner Secret.
            - name: OIDC_ISSUER
              value: ""
              valueFrom:
                secretKeyRef:
                  name: oidc-client-mcp-owner-secrets
                  key: OIDC_IDP_URI
            # Provisioning facts are read from Kubernetes directly; see the
            # PROVISIONING_* settings in the README for the optional knobs.
            # Browser origin exported by the OIDC owner Secret. A person who
            # opens this server's own hostname in a browser gets bounced there
            # instead of a JSON 404.
            - name: DRIFTMOWER_UI_PUBLIC_URL
              value: ""
              valueFrom:
                secretKeyRef:
                  name: oidc-client-mcp-owner-secrets
                  key: OIDC_CLIENT_ORIGIN
          # Probes report local MCP readiness without contacting dependencies.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          startupProbe:
            httpGet:
              path: /startupz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              memory: '128Mi'
              cpu: '50m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          {{- if .Values.crawler.url }}
          volumeMounts:
            - name: crawler-token
              mountPath: /var/run/secrets/driftmower/crawler
              readOnly: true
          {{- end }}
      {{- if .Values.crawler.url }}
      volumes:
        # Bound to the crawler's audience, so it is good for nothing else.
        - name: crawler-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.crawler.audience | default (printf "driftmower-crawler.%s" .Release.Namespace) | quote }}
                  expirationSeconds: 3600
                  path: token
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
