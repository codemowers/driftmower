apiVersion: v1
kind: Service
metadata:
  name: driftmower-mcp
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: driftmower-mcp
spec:
  type: ClusterIP
  selector:
    app: driftmower-mcp
  ports:
    - port: 3000
      targetPort: 3000
      name: mcp
    - port: 3001
      targetPort: health
      name: health
