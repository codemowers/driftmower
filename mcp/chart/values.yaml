# GitHub Actions publishes latest from main/master and image tags from Git tags.
# Skaffold overrides this with its built artifact for local development.
image: ghcr.io/codemowers/driftmower/mcp:latest

# Optional explicit cluster identity. Leave empty to use runtime discovery.
cluster:
  id: ""
  apiUrl: ""

rbac:
  # Name of the cluster-scoped ClusterRole and ClusterRoleBinding. A second
  # release in another namespace needs its own, or it rebinds this one.
  clusterRoleName: driftmower-mcp-observability
  # Names of the ConfigMaps admission guards read their parameters from. Empty
  # grants `get` on every ConfigMap (needed because a guard names its own);
  # set it to narrow the grant to those names.
  paramConfigMapNames: []

# Optional machine authentication; audience-bound TokenReview, then caller RBAC.
serviceAccountAuth:
  enabled: false

# Dedicated version-drift history, separate from resource-usage monitoring.
driftHistory:
  url: "http://driftmower-prometheus:9090"

# driftmower-crawler (crawler/chart) for get_source_findings and
# get_workload_findings. An empty url leaves both tools off. The crawler must
# list this release's ServiceAccount in its allowedCallers.
crawler:
  url: ""
  # The crawler's token audience; defaults to driftmower-crawler.<namespace>,
  # which matches a crawler in the same namespace.
  audience: ""

# Public browser client: authorization code + PKCE, credentials only in tab memory.
webUi:
  enabled: false
  # Set full URLs on clusters without hostname expansion policies.
  origin: "https://mcp"
  redirectUri: "https://mcp/ui/callback"

# Optional caller-authorized workload mutations. Disabled by default.
workloadRestart:
  enabled: false

# Public static-dashboard client; unset leaves browser client discovery disabled.
dashboard:
  origin: ""
  clientSecretName: ""
  # Exact loopback origins for a local static dashboard using the native client.
  localOrigins: []
