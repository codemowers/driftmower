name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  go:
    name: Go vet, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: ./cmd/... ./internal/...

      - name: Test
        run: go test -race ./cmd/... ./internal/...

  integration:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Exercise HTTP transport and health endpoints
        run: docker compose --profile test run --build --rm test node --import tsx test/compose-smoke.ts

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up Compose
        if: always()
        run: docker compose --profile test down --volumes

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - integration
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Select image tag
        id: image
        run: |
          image_tag=latest
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            image_tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$image_tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Git tag is not a valid Docker tag: $image_tag" >&2
            exit 1
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/codemowers/driftmower-mcp:${{ steps.image.outputs.tag }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
