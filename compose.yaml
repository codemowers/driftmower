services:
  dashboard:
    image: driftmower-dashboard:local
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCP_ENDPOINTS: >-
        [{"name":"ee-lte-1","url":"https://mcp.driftmower.ee-lte-1.codemowers.io/mcp"},
         {"name":"ee-west-1","url":"https://mcp.driftmower.ee-west-1.codemowers.io/mcp"}]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
