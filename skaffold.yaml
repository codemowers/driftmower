# All components build and deploy together. Select a cluster through local env settings.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: driftmower

build:
  cluster:
    # Build namespace is independent of Skaffold's deploy namespace.
    namespace: driftmower
    dockerConfig:
      secretName: zot-registry-cluster-push-kaniko
    # 0 is unlimited: every artifact builds in parallel.
    concurrency: 0
    nodeSelector:
      kubernetes.io/arch: amd64
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
        ephemeralStorage: 12Gi
      limits:
        memory: 8Gi
        ephemeralStorage: 24Gi
    volumes:
      - name: kaniko-trust
        configMap:
          name: trusted-ca-certs
  artifacts:
    - image: driftmower-crawler
      platforms:
        - linux/amd64
      # The repository root, where go.mod is.
      context: .
      kaniko:
        env:
          # Zot requires OCI manifests, including the DB image built FROM scratch.
          - name: FF_KANIKO_OCI_SCRATCH_BASE
            value: "true"
          - name: GOMEMLIMIT
            value: 6GiB
          - name: SSL_CERT_FILE
            value: /kaniko/trust/ca.pem
        volumeMounts:
          - name: kaniko-trust
            mountPath: /kaniko/trust
            readOnly: true
        dockerfile: crawler/Dockerfile
    - image: driftmower-mcp
      platforms:
        - linux/amd64
      context: .
      kaniko:
        env:
          # Zot requires OCI manifests, including the DB image built FROM scratch.
          - name: FF_KANIKO_OCI_SCRATCH_BASE
            value: "true"
          - name: GOMEMLIMIT
            value: 6GiB
          - name: SSL_CERT_FILE
            value: /kaniko/trust/ca.pem
        volumeMounts:
          - name: kaniko-trust
            mountPath: /kaniko/trust
            readOnly: true
        dockerfile: mcp/Dockerfile
    - image: driftmower-ui
      platforms:
        - linux/amd64
      context: .
      kaniko:
        env:
          # Zot requires OCI manifests, including the DB image built FROM scratch.
          - name: FF_KANIKO_OCI_SCRATCH_BASE
            value: "true"
          - name: GOMEMLIMIT
            value: 6GiB
          - name: SSL_CERT_FILE
            value: /kaniko/trust/ca.pem
        volumeMounts:
          - name: kaniko-trust
            mountPath: /kaniko/trust
            readOnly: true
        dockerfile: ui/Dockerfile
    - image: driftmower-operator
      platforms: [linux/amd64]
      context: .
      kaniko:
        env:
          # Zot requires OCI manifests, including the DB image built FROM scratch.
          - name: FF_KANIKO_OCI_SCRATCH_BASE
            value: "true"
          - name: GOMEMLIMIT
            value: 6GiB
          - name: SSL_CERT_FILE
            value: /kaniko/trust/ca.pem
        volumeMounts:
          - name: kaniko-trust
            mountPath: /kaniko/trust
            readOnly: true
        dockerfile: operator/Dockerfile
    - image: driftmower-trivy-db
      platforms: [linux/amd64]
      context: .
      kaniko:
        env:
          # Zot requires OCI manifests, including the DB image built FROM scratch.
          - name: FF_KANIKO_OCI_SCRATCH_BASE
            value: "true"
          - name: GOMEMLIMIT
            value: 6GiB
          - name: SSL_CERT_FILE
            value: /kaniko/trust/ca.pem
        volumeMounts:
          - name: kaniko-trust
            mountPath: /kaniko/trust
            readOnly: true
        dockerfile: operator/database.Dockerfile
        # No Kaniko layer cache: rebuilding refreshes the upstream databases.

manifests:
  helm:
    # Helm template is offline: advertise APIs installed on our deployment
    # clusters so capability-guarded resources are not silently omitted.
    flags:
      template:
        - --api-versions=monitoring.coreos.com/v1/PodMonitor
        - --api-versions=monitoring.coreos.com/v1/ServiceMonitor
        - --api-versions=monitoring.coreos.com/v1/PrometheusRule
        - --api-versions=monitoring.coreos.com/v1/Prometheus
        - --api-versions=codemowers.ai/v1alpha1/ClusterMCPServer
    releases:
      - name: driftmower
        chartPath: chart
        skipBuildDependencies: true
        setValues:
          crawler.nodeSelector.kubernetes\.io/arch: amd64
          mcp.workloadRestart.enabled: true
          mcp.userAccess.enabled: true
          mcp.serviceAccountAuth.enabled: true
          mcp.dashboard.localOrigins: ['http://localhost:17843', 'http://127.0.0.1:17843', 'http://localhost:8080', 'http://127.0.0.1:8080']
          ui.nodeSelector.kubernetes\.io/arch: amd64
          history.storageClassName: prometheus
          operator.sbomStorageClassName: scratch
          registryScraper.storageClassName: scratch
        setValueTemplates:
          crawler.image: "{{.IMAGE_FULLY_QUALIFIED_driftmower_crawler}}"
          mcp.image: "{{.IMAGE_FULLY_QUALIFIED_driftmower_mcp}}"
          mcp.auth.mode: '{{ default "rbac" .MCP_AUTH_MODE }}'
          mcp.ingress.enabled: '{{ default "true" .MCP_INGRESS_ENABLED }}'
          mcp.publicUrl: '{{ default "" .MCP_PUBLIC_URL }}'
          ui.enabled: '{{ default "true" .UI_ENABLED }}'
          operator.enabled: '{{ default "true" .OPERATOR_ENABLED }}'
          mcp.metrics.prometheusNamespace: '{{ default "monitoring" .PROMETHEUS_NAMESPACE }}'
          ui.image: "{{.IMAGE_FULLY_QUALIFIED_driftmower_ui}}"
          operator.image: "{{.IMAGE_FULLY_QUALIFIED_driftmower_operator}}"
          operator.databaseImage: "{{.IMAGE_FULLY_QUALIFIED_driftmower_trivy_db}}"
          # Comma-separated Secret names from the environment, for images from
          # another cluster's registry.
          imagePullSecrets: '{{ printf "{%s}" (default "" .IMAGE_PULL_SECRETS) }}'
          # Per-cluster components and command context.
          crawler.enabled: '{{ default "true" .CRAWLER_ENABLED }}'
          registryScraper.enabled: '{{ default "true" .REGISTRY_SCRAPER_ENABLED }}'
          ui.kubeContext: '{{ default (default "" .SKAFFOLD_KUBE_CONTEXT) .KUBECTL_CONTEXT }}'
          # Argo CD's public address, when it manages this cluster's workloads.
          mcp.argocd.url: '{{ default "" .ARGO_URL }}'

deploy:
  kubectl:
    flags:
      # Keep labeled resources when Skaffold cleans up.
      delete:
        - --selector=skaffold.dev/keep!=true

portForward:
  - resourceType: deployment
    resourceName: driftmower-mcp
    port: 3000
    localPort: 3000
  - resourceType: deployment
    resourceName: driftmower-mcp
    port: 3001
    localPort: 3001

profiles:
  # Build on this machine's Docker instead of Kaniko in the cluster, all
  # artifacts at once: `skaffold run -p local`. Needs `docker login` to the
  # registry; the containerd image store keeps the OCI manifests Zot requires.
  # Host networking gives builds the VPN routes and DNS.
  - name: local
    build:
      local:
        push: true
        useBuildkit: true
        concurrency: 0
      artifacts:
        - image: driftmower-crawler
          platforms: [linux/amd64]
          context: .
          docker:
            dockerfile: crawler/Dockerfile
            network: host
        - image: driftmower-mcp
          platforms: [linux/amd64]
          context: .
          docker:
            dockerfile: mcp/Dockerfile
            network: host
        - image: driftmower-ui
          platforms: [linux/amd64]
          context: .
          docker:
            dockerfile: ui/Dockerfile
            network: host
        - image: driftmower-operator
          platforms: [linux/amd64]
          context: .
          docker:
            dockerfile: operator/Dockerfile
            network: host
        - image: driftmower-trivy-db
          platforms: [linux/amd64]
          context: .
          docker:
            dockerfile: operator/database.Dockerfile
            network: host
