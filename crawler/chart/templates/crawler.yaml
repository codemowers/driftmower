apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftmower-crawler
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: driftmower-crawler
rules:
  - apiGroups: [codemowers.io]
    resources: [sourcerepositories, containerimages]
    verbs: [list, watch]
  # Authenticates the callers reading reports.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: driftmower-crawler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: driftmower-crawler
subjects:
  - kind: ServiceAccount
    name: driftmower-crawler
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftmower-crawler
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: driftmower-crawler
spec:
  # Crawl state lives in memory; a second replica would crawl twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: driftmower-crawler
  template:
    metadata:
      labels:
        app: driftmower-crawler
    spec:
      serviceAccountName: driftmower-crawler
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: driftmower-crawler
          image: {{ .Values.image | default (printf "ghcr.io/codemowers/driftmower/crawler:%s" .Chart.AppVersion) | quote }}
          command: ["/driftmower-crawler"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CRAWLER_AUDIENCE
              value: {{ printf "driftmower-crawler.%s" .Release.Namespace | quote }}
            - name: ALLOWED_CALLERS
              value: {{ include "driftmower.allowedCallers" . | quote }}
            - name: CRAWL_INTERVAL
              value: {{ .Values.crawler.interval | quote }}
            - name: GITEA_HOSTS
              value: {{ join "," .Values.crawler.giteaHosts | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.crawler.githubTokenSecret }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: token
                  optional: true
            {{- end }}
          ports:
            - containerPort: 8080
              name: api
            - containerPort: 8081
              name: health
            # Bound to the Pod's loopback address: reachable through
            # kubectl port-forward only, never through the Service.
            - containerPort: 8082
              name: ui
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          {{- with .Values.crawler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: driftmower-crawler
  namespace: {{ .Release.Namespace | quote }}
spec:
  selector:
    app: driftmower-crawler
  ports:
    - name: api
      port: 8080
      targetPort: api
---
# Only the allowed callers' Pods reach the API; kubelet probes stay admitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: driftmower-crawler
  namespace: {{ .Release.Namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app: driftmower-crawler
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.crawler.allowedCallers }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              app: {{ .name | quote }}
        {{- end }}
      ports:
        - port: api
